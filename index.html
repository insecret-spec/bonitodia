<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Una sorpresa para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#2a2622;
    --ink-soft:#6f665c;
    --neon-yellow:#f4ff2b;
    --neon-yellow-2:#fffb8f;
    --neon-pink:#ff2fb0;
    --neon-pink-2:#ff8fdc;
    --card:#fffdf6;
    --line:#efe9db;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    font-family:'Poppins',sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage{
    width:100%;
    max-width:460px;
    min-height:100svh;
    padding:32px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
  }

  .screen{
    width:100%;
    display:none;
    flex-direction:column;
    align-items:center;
    animation:fadeIn .6s ease both;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Pantalla 1: clave ---------- */
  .lock-title{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
    text-align:center;
  }
  .lock-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 26px;
    text-align:center;
    letter-spacing:.02em;
  }
  .dots{
    display:flex;
    gap:16px;
    margin-bottom:30px;
    height:18px;
  }
  .dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid var(--neon-pink);
    background:transparent;
    transition:background .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .dot.filled{
    background:var(--neon-pink);
    box-shadow:0 0 6px var(--neon-pink), 0 0 16px var(--neon-pink), 0 0 28px var(--neon-pink-2);
    transform:scale(1.08);
  }
  .dots.shake{animation:shake .38s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-9px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(5px);}
  }

  .keypad{
    display:grid;
    grid-template-columns:repeat(3, clamp(56px, 19vw, 74px));
    gap:clamp(10px, 4vw, 16px);
    justify-content:center;
    touch-action:manipulation;
  }
  .key{
    width:clamp(56px, 19vw, 74px);
    height:clamp(56px, 19vw, 74px);
    border-radius:50%;
    border:1.5px solid var(--neon-yellow);
    background:#fffef2;
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    font-size:clamp(18px, 5.5vw, 24px);
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 5px rgba(244,255,43,.55), 0 0 14px rgba(244,255,43,.35), inset 0 0 8px rgba(244,255,43,.18);
    transition:transform .08s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:manipulation;
  }
  .key:active{
    transform:scale(.92);
    box-shadow:0 0 10px var(--neon-yellow), 0 0 26px var(--neon-yellow), 0 0 40px var(--neon-yellow-2);
  }
  .key.fn{
    font-size:clamp(11px, 3.4vw, 15px);
    font-weight:400;
    border-color:var(--neon-pink);
    box-shadow:0 0 5px rgba(255,47,176,.5), 0 0 14px rgba(255,47,176,.3);
  }
  .key.fn:active{
    box-shadow:0 0 10px var(--neon-pink), 0 0 26px var(--neon-pink), 0 0 40px var(--neon-pink-2);
  }
  .hint{
    margin-top:22px;
    font-size:11.5px;
    color:var(--ink-soft);
    min-height:16px;
  }
  .hint.err{color:var(--neon-pink);}

  /* ---------- Pantalla 2: historia con rosas ---------- */
  .story-wrap{
    position:relative;
    width:100%;
    min-height:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .roses{
    position:absolute;
    inset:0;
    overflow:visible;
    pointer-events:none;
  }
  .rose{
    position:absolute;
    filter:drop-shadow(0 0 4px var(--neon-yellow)) drop-shadow(0 0 12px var(--neon-yellow)) drop-shadow(0 0 22px var(--neon-yellow-2));
    animation:glowPulse 2.6s ease-in-out infinite, drift 7s ease-in-out infinite;
    opacity:.95;
  }
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 3px var(--neon-yellow)) drop-shadow(0 0 9px var(--neon-yellow)) drop-shadow(0 0 16px var(--neon-yellow-2));}
    50%{filter:drop-shadow(0 0 7px var(--neon-yellow)) drop-shadow(0 0 20px var(--neon-yellow)) drop-shadow(0 0 34px var(--neon-yellow-2));}
  }
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(var(--rot,0deg));}
    50%{transform:translateY(-9px) rotate(var(--rot,0deg));}
  }
  .story-card{
    position:relative;
    z-index:2;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:34px 26px;
    text-align:center;
    box-shadow:0 8px 28px rgba(0,0,0,.06);
  }
  .story-text{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:21px;
    line-height:1.5;
    color:var(--ink);
    margin:0;
    min-height:132px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .story-index{
    margin-top:18px;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
  }

  /* ---------- Pantalla 3: video ---------- */
  .video-title{
    font-family:'Cormorant Garamond',serif;
    font-size:24px;
    font-weight:600;
    margin:0 0 18px;
    text-align:center;
  }
  .video-box{
    width:100%;
    max-width:420px;
    aspect-ratio:9/16;
    max-height:calc(100svh - 140px);
    border-radius:22px;
    overflow:hidden;
    position:relative;
    background:#faf8f0;
    border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(255,47,176,.15), 0 10px 34px rgba(0,0,0,.08), 0 0 26px rgba(244,255,43,.25);
  }
  .video-box iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  /* ---------- Botón común ---------- */
  .next-btn{
    margin-top:28px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-family:'Poppins',sans-serif;
    font-size:15px;
    font-weight:600;
    width:min(100%, 260px);
    min-height:50px;
    padding:0 30px;
    border-radius:30px;
    cursor:pointer;
    letter-spacing:.02em;
    transition:transform .12s ease, box-shadow .2s ease;
    box-shadow:0 0 0 rgba(244,255,43,0);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .next-btn:hover{box-shadow:0 0 16px rgba(244,255,43,.5);}
  .next-btn:active{transform:scale(.96);}

  /* ---------- Transición: viaje por el universo ---------- */
  .warp-overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 50%, #140a24 0%, #05020c 70%, #000 100%);
    z-index:80;
    opacity:0;
    pointer-events:none;
    transition:opacity .28s ease;
    overflow:hidden;
  }
  .warp-overlay.show{opacity:1; pointer-events:all;}
  .warp-star{
    position:absolute;
    left:50%; top:50%;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--neon-yellow);
    box-shadow:0 0 6px var(--neon-yellow), 0 0 12px var(--neon-yellow-2);
    opacity:0;
    transform:translate(-50%,-50%);
  }
  .warp-overlay.show .warp-star{
    animation:warpFly var(--dur,.9s) var(--delay,0s) ease-in forwards;
  }
  @keyframes warpFly{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.3);}
    12%{opacity:1;}
    100%{
      opacity:0;
      transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.4);
    }
  }
  .warp-label{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    color:var(--neon-yellow-2);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    letter-spacing:.04em;
    opacity:0;
    white-space:nowrap;
  }
  .warp-overlay.show .warp-label{animation:warpLabel .9s ease forwards;}
  @keyframes warpLabel{
    0%,100%{opacity:0;}
    35%,65%{opacity:.85;}
  }

  /* ---------- Pantalla: Tierra a la Luna ---------- */
  .space-screen{
    background:radial-gradient(circle at 30% 20%, #1a0f30 0%, #050110 60%, #000 100%);
    border-radius:22px;
    width:100%;
    min-height:420px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .space-bg-star{
    position:absolute;
    border-radius:50%;
    background:#fff;
  }
  .supernova-core{
    position:absolute;
    left:50%; top:50%;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--neon-yellow);
    box-shadow:0 0 10px var(--neon-yellow);
    transform:translate(-50%,-50%);
    opacity:0;
    z-index:4;
  }
  .space-screen.fly .supernova-core{
    animation:novaCore 3.2s ease forwards;
  }
  @keyframes novaCore{
    0%{opacity:0; width:6px; height:6px;}
    8%{opacity:1; width:10px; height:10px;}
    30%{width:30px; height:30px; box-shadow:0 0 34px var(--neon-yellow), 0 0 60px var(--neon-yellow-2);}
    42%{width:52px; height:52px; box-shadow:0 0 70px var(--neon-yellow), 0 0 130px var(--neon-yellow-2); opacity:1;}
    48%{width:8px; height:8px; opacity:1;}
    62%{opacity:.5; width:5px; height:5px;}
    100%{opacity:0; width:4px; height:4px;}
  }
  .nova-flash{
    position:absolute;
    inset:0;
    z-index:3;
    opacity:0;
    pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(244,255,43,.55) 35%, rgba(244,255,43,0) 70%);
  }
  .space-screen.fly .nova-flash{
    animation:novaFlash 3.2s ease forwards;
  }
  @keyframes novaFlash{
    0%,40%{opacity:0;}
    46%{opacity:1;}
    64%{opacity:0;}
    100%{opacity:0;}
  }
  .nova-ray{
    position:absolute;
    left:50%; top:50%;
    width:0; height:2px;
    background:linear-gradient(90deg, var(--neon-yellow), transparent);
    transform-origin:0 50%;
    opacity:0;
    z-index:2;
  }
  .space-screen.fly .nova-ray{
    animation:novaRayOut 1.5s ease-out forwards;
    animation-delay:var(--rdelay, .45s);
  }
  @keyframes novaRayOut{
    0%{width:0; opacity:0;}
    12%{opacity:1;}
    100%{width:var(--rlen, 160px); opacity:0;}
  }
  .nova-particle{
    position:absolute;
    left:50%; top:50%;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--neon-yellow-2);
    box-shadow:0 0 6px var(--neon-yellow);
    opacity:0;
    z-index:2;
  }
  .space-screen.fly .nova-particle{
    animation:novaParticleOut 2.3s ease-out forwards;
    animation-delay:var(--pdelay, .5s);
  }
  @keyframes novaParticleOut{
    0%{opacity:0; transform:translate(-50%,-50%) scale(1);}
    10%{opacity:1;}
    100%{opacity:0; transform:translate(calc(-50% + var(--px,120px)), calc(-50% + var(--py,120px))) scale(.3);}
  }
  .space-sub{
    position:absolute;
    bottom:24px;
    left:0; right:0;
    text-align:center;
    color:rgba(255,255,255,.55);
    font-size:11px;
    letter-spacing:.08em;
  }

  /* ---------- Universo animado (fondo del video, pantalla completa) ---------- */
  .video-universe-bg{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .6s ease;
    background:radial-gradient(circle at 25% 20%, #1a0f30 0%, #050110 55%, #000 100%);
    overflow:hidden;
  }
  .video-universe-bg.show{opacity:1;}
  .galaxy{
    position:absolute;
    border-radius:50%;
    filter:blur(40px);
    opacity:.55;
    mix-blend-mode:screen;
  }
  .galaxy-1{
    width:46vmax; height:46vmax;
    top:-14vmax; left:-16vmax;
    background:radial-gradient(circle, rgba(255,47,176,.65), rgba(255,47,176,0) 70%);
    animation:galaxyDrift1 30s linear infinite;
  }
  .galaxy-2{
    width:52vmax; height:52vmax;
    bottom:-18vmax; right:-18vmax;
    background:radial-gradient(circle, rgba(120,140,255,.55), rgba(120,140,255,0) 70%);
    animation:galaxyDrift2 38s linear infinite;
  }
  .galaxy-3{
    width:36vmax; height:36vmax;
    top:38%; right:-12vmax;
    background:radial-gradient(circle, rgba(244,255,43,.4), rgba(244,255,43,0) 70%);
    animation:galaxyDrift3 44s linear infinite;
  }
  @keyframes galaxyDrift1{
    0%{transform:rotate(0deg) translateX(0) scale(1);}
    50%{transform:rotate(180deg) translateX(30px) scale(1.12);}
    100%{transform:rotate(360deg) translateX(0) scale(1);}
  }
  @keyframes galaxyDrift2{
    0%{transform:rotate(0deg) translateX(0) scale(1);}
    50%{transform:rotate(-180deg) translateX(-24px) scale(1.15);}
    100%{transform:rotate(-360deg) translateX(0) scale(1);}
  }
  @keyframes galaxyDrift3{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-26px) rotate(180deg);}
    100%{transform:translateY(0) rotate(360deg);}
  }
  .video-stars{
    position:absolute;
    inset:0;
    animation:videoStarSpin 200s linear infinite;
  }
  .video-star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes videoStarSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes twinkle{
    0%,100%{opacity:.25;}
    50%{opacity:.9;}
  }
  .video-content{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;}
  .nice-day{
    margin-top:22px;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:19px;
    color:var(--neon-yellow-2);
    text-shadow:0 0 8px rgba(244,255,43,.55), 0 0 18px rgba(244,255,43,.35);
    opacity:0;
    transform:translateY(8px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .nice-day.show{opacity:1; transform:translateY(0);}

  /* ---------- Efecto de escritura ---------- */
  .pen{
    display:inline-block;
    font-size:.85em;
    transform:rotate(8deg);
    margin-left:2px;
    animation:penBob .5s ease-in-out infinite;
    opacity:1;
    transition:opacity .4s ease;
  }
  .pen.hide{opacity:0;}
  @keyframes penBob{
    0%,100%{transform:rotate(8deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-2px);}
  }
</style>
</head>
<body>

<div class="stage">

  <!-- PANTALLA 1: CLAVE -->
  <section class="screen active" id="screen-lock">
    <h1 class="lock-title">Ingresa el pin</h1>
    <p class="lock-sub">Solo tú lo conoces</p>
    <div class="dots" id="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key fn" data-k="clear">Borrar</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-k="enter">Entrar</button>
    </div>
    <p class="hint" id="lockHint">&nbsp;</p>
  </section>

  <!-- PANTALLA 2: HISTORIA -->
  <section class="screen" id="screen-story">
    <div class="story-wrap">
      <svg class="roses" viewBox="0 0 400 420" preserveAspectRatio="xMidYMid meet">
        <g class="rose" style="left:6%; top:6%; --rot:-8deg;">
          <use href="#rose-shape" x="0" y="0" width="72" height="72"></use>
        </g>
        <g class="rose" style="right:4%; top:2%; --rot:10deg; animation-delay:.6s, .3s;">
          <use href="#rose-shape" x="0" y="0" width="58" height="58"></use>
        </g>
        <g class="rose" style="left:-2%; bottom:8%; --rot:6deg; animation-delay:1.1s, .9s;">
          <use href="#rose-shape" x="0" y="0" width="64" height="64"></use>
        </g>
        <g class="rose" style="right:0%; bottom:4%; --rot:-12deg; animation-delay:1.6s, .2s;">
          <use href="#rose-shape" x="0" y="0" width="54" height="54"></use>
        </g>
        <defs>
          <g id="rose-shape">
            <path d="M36 8c8 0 14 6 14 13 0 5-3 9-7 11 6 1 10 6 10 12 0 8-7 14-17 14s-17-6-17-14c0-6 4-11 10-12-4-2-7-6-7-11 0-7 6-13 14-13z" fill="var(--neon-yellow)"/>
            <path d="M36 60v6M30 66c0-4 3-6 6-6s6 2 6 6" fill="none" stroke="var(--neon-yellow)" stroke-width="3" stroke-linecap="round"/>
          </g>
        </defs>
      </svg>
      <div class="story-card">
        <p class="story-text" id="storyText"><span id="typedSpan"></span><span class="pen" id="penIcon">✍️</span></p>
        <p class="story-index" id="storyIndex"></p>
      </div>
    </div>
    <button class="next-btn" id="storyNextBtn">Siguiente</button>
  </section>

  <!-- PANTALLA 2.5: SUPERNOVA -->
  <section class="screen" id="screen-space">
    <div class="space-screen" id="spaceScreen">
      <div id="spaceStars"></div>
      <div class="nova-flash"></div>
      <span class="supernova-core"></span>
      <div id="novaRays"></div>
      <div id="novaParticles"></div>
      <p class="space-sub">preparando...</p>
    </div>
  </section>

  <!-- PANTALLA 3: VIDEO -->
  <section class="screen" id="screen-video">
    <div class="video-content">
      <div class="video-box">
        <iframe id="vimeoFrame" src="https://player.vimeo.com/video/1228565444?title=0&byline=0&portrait=0&loop=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
      </div>
      <p class="nice-day" id="niceDay">Que tengas un bonito día ☀️</p>
    </div>
  </section>

</div>

<div class="video-universe-bg" id="videoUniverseBg">
  <div class="galaxy galaxy-1"></div>
  <div class="galaxy galaxy-2"></div>
  <div class="galaxy galaxy-3"></div>
  <div class="video-stars" id="videoStars"></div>
</div>

<div class="warp-overlay" id="warpOverlay">
  <span class="warp-label" id="warpLabel">atravesando el universo…</span>
</div>

<script>
(function(){
  var CODE = "1603";
  var entered = "";
  var dots = document.querySelectorAll("#dots .dot");
  var dotsRow = document.getElementById("dots");
  var hint = document.getElementById("lockHint");

  function paintDots(){
    dots.forEach(function(d, i){
      d.classList.toggle("filled", i < entered.length);
    });
  }

  document.getElementById("keypad").addEventListener("click", function(e){
    var btn = e.target.closest(".key");
    if(!btn) return;
    var k = btn.getAttribute("data-k");

    if(k === "clear"){
      entered = "";
      hint.textContent = "\u00a0";
      hint.classList.remove("err");
      paintDots();
      return;
    }

    if(k === "enter"){
      if(entered.length < 4){
        hint.textContent = "Faltan números";
        hint.classList.add("err");
        return;
      }
      if(entered === CODE){
        goTo("screen-story");
      } else {
        hint.textContent = "Código incorrecto, inténtalo de nuevo";
        hint.classList.add("err");
        dotsRow.classList.remove("shake");
        void dotsRow.offsetWidth;
        dotsRow.classList.add("shake");
        entered = "";
        setTimeout(paintDots, 120);
      }
      return;
    }

    if(entered.length >= 4) return;
    entered += k;
    hint.textContent = "\u00a0";
    hint.classList.remove("err");
    paintDots();
  });

  var phrases = [
    "Porque Los mejores momentos solo se viven una vez.",
    "Y los recuerdos se quedan para siempre.",
    "Que estas flores representen todos los buenos momentos que todavía os faltan por vivir.",
    "Porque tu corazón alegre es la mejor medicina para quienes te rodean.😊"
  ];
  var warpLines = [
    "cruzando estrellas…",
    "atravesando el universo…",
    "un instante más…",
    "casi llegamos…"
  ];
  var storyText = document.getElementById("storyText");
  var storyIndex = document.getElementById("storyIndex");
  var storyNextBtn = document.getElementById("storyNextBtn");
  var warpOverlay = document.getElementById("warpOverlay");
  var warpLabel = document.getElementById("warpLabel");
  var typedSpan = document.getElementById("typedSpan");
  var penIcon = document.getElementById("penIcon");
  var idx = 0;
  var busy = false;
  var typeTimer = null;

  function renderPhrase(){
    clearInterval(typeTimer);
    typedSpan.textContent = "";
    penIcon.classList.remove("hide");
    var text = phrases[idx];
    var i = 0;
    typeTimer = setInterval(function(){
      typedSpan.textContent += text.charAt(i);
      i++;
      if(i >= text.length){
        clearInterval(typeTimer);
        setTimeout(function(){ penIcon.classList.add("hide"); }, 500);
      }
    }, 38);
    storyIndex.textContent = (idx+1) + " / " + phrases.length;
  }

  function buildWarpStars(count){
    warpOverlay.querySelectorAll(".warp-star").forEach(function(s){ s.remove(); });
    for(var i=0; i<count; i++){
      var s = document.createElement("span");
      s.className = "warp-star";
      var angle = Math.random() * Math.PI * 2;
      var dist = 220 + Math.random() * 260;
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist;
      s.style.setProperty("--tx", tx.toFixed(0) + "px");
      s.style.setProperty("--ty", ty.toFixed(0) + "px");
      s.style.setProperty("--dur", (0.6 + Math.random()*0.6).toFixed(2) + "s");
      s.style.setProperty("--delay", (Math.random()*0.15).toFixed(2) + "s");
      warpOverlay.appendChild(s);
    }
  }

  function warpJump(onMidpoint, done, duration){
    duration = duration || 850;
    busy = true;
    warpLabel.textContent = warpLines[Math.floor(Math.random()*warpLines.length)];
    buildWarpStars(46);
    warpOverlay.classList.add("show");
    setTimeout(function(){
      onMidpoint && onMidpoint();
    }, duration * 0.42);
    setTimeout(function(){
      warpOverlay.classList.remove("show");
      busy = false;
      done && done();
    }, duration);
  }

  storyNextBtn.addEventListener("click", function(){
    if(busy) return;
    if(idx < phrases.length - 1){
      warpJump(function(){
        idx++;
        renderPhrase();
      });
    } else {
      goTo("screen-space");
    }
  });

  function buildSpaceStars(){
    var wrap = document.getElementById("spaceStars");
    wrap.innerHTML = "";
    for(var i=0; i<70; i++){
      var s = document.createElement("span");
      s.className = "space-bg-star";
      var size = Math.random() < .85 ? 1.5 : 2.5;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random()*100) + "%";
      s.style.top = (Math.random()*100) + "%";
      s.style.opacity = (0.25 + Math.random()*0.6).toFixed(2);
      wrap.appendChild(s);
    }
  }

  function buildSupernova(){
    var rays = document.getElementById("novaRays");
    var particles = document.getElementById("novaParticles");
    rays.innerHTML = "";
    particles.innerHTML = "";
    var rayCount = 18;
    for(var i=0; i<rayCount; i++){
      var r = document.createElement("span");
      r.className = "nova-ray";
      var angle = (360/rayCount) * i + (Math.random()*6 - 3);
      var len = 120 + Math.random()*90;
      var delay = 0.45 + Math.random()*0.18;
      r.style.setProperty("--rlen", len.toFixed(0) + "px");
      r.style.setProperty("--rdelay", delay.toFixed(2) + "s");
      r.style.transform = "rotate(" + angle.toFixed(1) + "deg)";
      rays.appendChild(r);
    }
    var particleCount = 46;
    for(var j=0; j<particleCount; j++){
      var p = document.createElement("span");
      p.className = "nova-particle";
      var pAngle = Math.random() * Math.PI * 2;
      var pDist = 90 + Math.random()*150;
      var px = Math.cos(pAngle) * pDist;
      var py = Math.sin(pAngle) * pDist;
      p.style.setProperty("--px", px.toFixed(0) + "px");
      p.style.setProperty("--py", py.toFixed(0) + "px");
      p.style.setProperty("--pdelay", (0.5 + Math.random()*0.3).toFixed(2) + "s");
      particles.appendChild(p);
    }
  }

  function buildVideoStars(){
    var wrap = document.getElementById("videoStars");
    if(wrap.childElementCount) return;
    for(var i=0; i<90; i++){
      var s = document.createElement("span");
      s.className = "video-star";
      var size = Math.random() < .8 ? 1.5 : 2.5;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random()*100) + "%";
      s.style.top = (Math.random()*100) + "%";
      s.style.animationDelay = (Math.random()*3).toFixed(2) + "s";
      wrap.appendChild(s);
    }
  }

  function goTo(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    document.getElementById("videoUniverseBg").classList.toggle("show", id === "screen-video");
    if(id === "screen-story"){
      idx = 0;
      renderPhrase();
    }
    if(id === "screen-space"){
      var spaceScreen = document.getElementById("spaceScreen");
      spaceScreen.classList.remove("fly");
      buildSpaceStars();
      buildSupernova();
      void spaceScreen.offsetWidth;
      spaceScreen.classList.add("fly");
      setTimeout(function(){ goTo("screen-video"); }, 4000);
    }
    if(id === "screen-video"){
      buildVideoStars();
      var niceDay = document.getElementById("niceDay");
      niceDay.classList.remove("show");
      setTimeout(function(){ niceDay.classList.add("show"); }, 3200);
    }
  }
})();
</script>
</body>
</html>
