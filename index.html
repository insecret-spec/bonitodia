<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Una sorpresa para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#2a2622;
    --ink-soft:#6f665c;
    --neon-yellow:#f4ff2b;
    --neon-yellow-2:#fffb8f;
    --neon-pink:#ff2fb0;
    --neon-pink-2:#ff8fdc;
    --card:#fffdf6;
    --line:#efe9db;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    font-family:'Poppins',sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,143,220,.16), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(244,255,43,.18), transparent 45%),
      #ffffff;
  }
  .stage{
    width:100%;
    max-width:460px;
    min-height:100svh;
    padding:32px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
  }

  .screen{
    width:100%;
    display:none;
    flex-direction:column;
    align-items:center;
    animation:fadeIn .6s ease both;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Botón de música ---------- */
  .music-btn{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top,0px));
    right:14px;
    z-index:90;
    width:44px; height:44px;
    border-radius:50%;
    border:1.5px solid var(--neon-pink);
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    font-size:19px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 6px rgba(255,47,176,.5), 0 0 16px rgba(255,47,176,.3);
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, opacity .2s ease;
  }
  .music-btn:active{transform:scale(.9);}
  .music-btn.off{opacity:.55;}
  .music-btn.gone{display:none;}
  .music-btn.on{animation:musicPulse 1.8s ease-in-out infinite;}
  @keyframes musicPulse{
    0%,100%{box-shadow:0 0 6px rgba(255,47,176,.5), 0 0 16px rgba(255,47,176,.3);}
    50%{box-shadow:0 0 12px rgba(255,47,176,.9), 0 0 28px rgba(255,47,176,.55);}
  }

  /* ---------- Pétalos cayendo ---------- */
  .petals{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-30px;
    width:var(--s,12px);
    height:calc(var(--s,12px) * 1.3);
    background:linear-gradient(135deg, var(--neon-pink-2), var(--neon-pink));
    border-radius:150% 0 150% 0;
    opacity:0;
    box-shadow:0 0 8px rgba(255,47,176,.45);
    animation:petalFall var(--d,7s) linear forwards;
  }
  @keyframes petalFall{
    0%{opacity:0; transform:translate3d(0,0,0) rotate(0deg);}
    10%{opacity:.9;}
    50%{transform:translate3d(var(--sway,30px), 55vh, 0) rotate(180deg);}
    90%{opacity:.8;}
    100%{opacity:0; transform:translate3d(calc(var(--sway,30px) * -1), 108vh, 0) rotate(360deg);}
  }

  /* ---------- Pantalla 1: clave ---------- */
  .lock-title{
    font-family:'Cormorant Garamond',serif;
    font-size:28px;
    font-weight:600;
    margin:0 0 6px;
    text-align:center;
  }
  .lock-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 26px;
    text-align:center;
    letter-spacing:.02em;
  }
  .lock-sub b{color:var(--neon-pink); font-weight:600;}
  .dots{
    display:flex;
    gap:16px;
    margin-bottom:30px;
    height:18px;
  }
  .dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid var(--neon-pink);
    background:transparent;
    transition:background .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .dot.filled{
    background:var(--neon-pink);
    box-shadow:0 0 6px var(--neon-pink), 0 0 16px var(--neon-pink), 0 0 28px var(--neon-pink-2);
    transform:scale(1.08);
  }
  .dots.shake{animation:shake .38s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-9px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(5px);}
  }
  .dots.burst .dot{
    background:var(--neon-yellow);
    border-color:var(--neon-yellow);
    box-shadow:0 0 12px var(--neon-yellow), 0 0 30px var(--neon-yellow), 0 0 50px var(--neon-yellow-2);
    animation:dotBurst .6s ease forwards;
  }
  @keyframes dotBurst{
    0%{transform:scale(1);}
    50%{transform:scale(2.1);}
    100%{transform:scale(1.4); opacity:.2;}
  }

  .keypad{
    display:grid;
    grid-template-columns:repeat(3, clamp(56px, 19vw, 74px));
    gap:clamp(10px, 4vw, 16px);
    justify-content:center;
    touch-action:manipulation;
  }
  .key{
    width:clamp(56px, 19vw, 74px);
    height:clamp(56px, 19vw, 74px);
    border-radius:50%;
    border:1.5px solid var(--neon-yellow);
    background:#fffef2;
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    font-size:clamp(18px, 5.5vw, 24px);
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 5px rgba(244,255,43,.55), 0 0 14px rgba(244,255,43,.35), inset 0 0 8px rgba(244,255,43,.18);
    transition:transform .08s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:manipulation;
  }
  .key:active{
    transform:scale(.92);
    box-shadow:0 0 10px var(--neon-yellow), 0 0 26px var(--neon-yellow), 0 0 40px var(--neon-yellow-2);
  }
  .key.fn{
    font-size:clamp(11px, 3.4vw, 15px);
    font-weight:400;
    border-color:var(--neon-pink);
    box-shadow:0 0 5px rgba(255,47,176,.5), 0 0 14px rgba(255,47,176,.3);
  }
  .key.fn:active{
    box-shadow:0 0 10px var(--neon-pink), 0 0 26px var(--neon-pink), 0 0 40px var(--neon-pink-2);
  }
  .hint{
    margin-top:22px;
    font-size:11.5px;
    color:var(--ink-soft);
    min-height:16px;
  }
  .hint.err{color:var(--neon-pink);}

  /* ---------- Pantalla 2: historia con rosas ---------- */
  .story-wrap{
    position:relative;
    width:100%;
    min-height:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .rose{
    position:absolute;
    pointer-events:none;
    animation:glowPulse 2.6s ease-in-out infinite, drift 7s ease-in-out infinite;
    opacity:.95;
    z-index:1;
  }
  .rose svg{width:100%; height:100%; overflow:visible; display:block;}
  .r1{left:-2%; top:0; width:70px; height:88px; --rot:-10deg;}
  .r2{right:-2%; top:-4px; width:56px; height:70px; --rot:12deg; animation-delay:.6s,.3s;}
  .r3{left:-4%; bottom:2%; width:62px; height:78px; --rot:8deg; animation-delay:1.1s,.9s;}
  .r4{right:-3%; bottom:0; width:52px; height:66px; --rot:-14deg; animation-delay:1.6s,.2s;}
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 3px var(--neon-yellow)) drop-shadow(0 0 9px var(--neon-yellow)) drop-shadow(0 0 16px var(--neon-yellow-2));}
    50%{filter:drop-shadow(0 0 7px var(--neon-yellow)) drop-shadow(0 0 20px var(--neon-yellow)) drop-shadow(0 0 34px var(--neon-yellow-2));}
  }
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(var(--rot,0deg));}
    50%{transform:translateY(-9px) rotate(var(--rot,0deg));}
  }
  .story-card{
    position:relative;
    z-index:2;
    width:100%;
    border:1.5px solid transparent;
    border-radius:20px;
    padding:34px 26px 26px;
    text-align:center;
    background:
      linear-gradient(rgba(255,253,246,.78), rgba(255,253,246,.78)) padding-box,
      linear-gradient(135deg, var(--neon-pink), var(--neon-yellow)) border-box;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 32px rgba(255,47,176,.12), 0 0 22px rgba(244,255,43,.22);
  }
  .story-text{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:23px;
    line-height:1.55;
    color:var(--ink);
    margin:0;
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .progress{
    margin-top:20px;
    display:flex;
    gap:9px;
    justify-content:center;
  }
  .pd{
    width:9px; height:9px;
    border-radius:50%;
    border:1.5px solid var(--neon-pink);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .pd.on{
    background:var(--neon-pink);
    box-shadow:0 0 6px var(--neon-pink), 0 0 14px var(--neon-pink-2);
  }

  /* ---------- Pantalla 3: video ---------- */
  .video-box{
    width:min(100%, 420px, calc((100vh - 250px) * 9 / 16));
    width:min(100%, 420px, calc((100svh - 250px) * 9 / 16));
    aspect-ratio:9/16;
    margin:0 auto;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    background:#faf8f0;
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 0 0 1px rgba(255,47,176,.35), 0 10px 34px rgba(0,0,0,.35), 0 0 30px rgba(244,255,43,.3);
  }
  .video-box iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  /* ---------- Botón común ---------- */
  .next-btn{
    margin-top:28px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-family:'Poppins',sans-serif;
    font-size:15px;
    font-weight:600;
    width:min(100%, 260px);
    min-height:50px;
    padding:0 30px;
    border-radius:30px;
    cursor:pointer;
    letter-spacing:.02em;
    transition:transform .12s ease, box-shadow .2s ease;
    box-shadow:0 0 0 rgba(244,255,43,0);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .next-btn:hover{box-shadow:0 0 16px rgba(244,255,43,.5);}
  .next-btn:active{transform:scale(.96);}

  /* ---------- Transición: viaje por el universo ---------- */
  .warp-overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 50%, #140a24 0%, #05020c 70%, #000 100%);
    z-index:80;
    opacity:0;
    pointer-events:none;
    transition:opacity .28s ease;
    overflow:hidden;
  }
  .warp-overlay.show{opacity:1; pointer-events:all;}
  .warp-star{
    position:absolute;
    left:50%; top:50%;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--neon-yellow);
    box-shadow:0 0 6px var(--neon-yellow), 0 0 12px var(--neon-yellow-2);
    opacity:0;
    transform:translate(-50%,-50%);
  }
  .warp-overlay.show .warp-star{
    animation:warpFly var(--dur,.9s) var(--delay,0s) ease-in forwards;
  }
  @keyframes warpFly{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.3);}
    12%{opacity:1;}
    100%{
      opacity:0;
      transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.4);
    }
  }
  .warp-label{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    color:var(--neon-yellow-2);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    letter-spacing:.04em;
    opacity:0;
    white-space:nowrap;
  }
  .warp-overlay.show .warp-label{animation:warpLabel .9s ease forwards;}
  @keyframes warpLabel{
    0%,100%{opacity:0;}
    35%,65%{opacity:.85;}
  }

  /* ---------- Pantalla: supernova ---------- */
  .space-screen{
    background:radial-gradient(circle at 30% 20%, #1a0f30 0%, #050110 60%, #000 100%);
    border-radius:22px;
    width:100%;
    min-height:420px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .space-bg-star{
    position:absolute;
    border-radius:50%;
    background:#fff;
  }
  .supernova-core{
    position:absolute;
    left:50%; top:50%;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--neon-yellow);
    box-shadow:0 0 10px var(--neon-yellow);
    transform:translate(-50%,-50%);
    opacity:0;
    z-index:4;
  }
  .space-screen.fly .supernova-core{
    animation:novaCore 3.2s ease forwards;
  }
  @keyframes novaCore{
    0%{opacity:0; width:6px; height:6px;}
    8%{opacity:1; width:10px; height:10px;}
    30%{width:30px; height:30px; box-shadow:0 0 34px var(--neon-yellow), 0 0 60px var(--neon-yellow-2);}
    42%{width:52px; height:52px; box-shadow:0 0 70px var(--neon-yellow), 0 0 130px var(--neon-yellow-2); opacity:1;}
    48%{width:8px; height:8px; opacity:1;}
    62%{opacity:.5; width:5px; height:5px;}
    100%{opacity:0; width:4px; height:4px;}
  }
  .nova-flash{
    position:absolute;
    inset:0;
    z-index:3;
    opacity:0;
    pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(244,255,43,.55) 35%, rgba(244,255,43,0) 70%);
  }
  .space-screen.fly .nova-flash{
    animation:novaFlash 3.2s ease forwards;
  }
  @keyframes novaFlash{
    0%,40%{opacity:0;}
    46%{opacity:1;}
    64%{opacity:0;}
    100%{opacity:0;}
  }
  .nova-ray{
    position:absolute;
    left:50%; top:50%;
    width:0; height:2px;
    background:linear-gradient(90deg, var(--neon-yellow), transparent);
    transform-origin:0 50%;
    opacity:0;
    z-index:2;
  }
  .space-screen.fly .nova-ray{
    animation:novaRayOut 1.5s ease-out forwards;
    animation-delay:var(--rdelay, .45s);
  }
  @keyframes novaRayOut{
    0%{width:0; opacity:0;}
    12%{opacity:1;}
    100%{width:var(--rlen, 160px); opacity:0;}
  }
  .nova-particle{
    position:absolute;
    left:50%; top:50%;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--neon-yellow-2);
    box-shadow:0 0 6px var(--neon-yellow);
    opacity:0;
    z-index:2;
  }
  .space-screen.fly .nova-particle{
    animation:novaParticleOut 2.3s ease-out forwards;
    animation-delay:var(--pdelay, .5s);
  }
  @keyframes novaParticleOut{
    0%{opacity:0; transform:translate(-50%,-50%) scale(1);}
    10%{opacity:1;}
    100%{opacity:0; transform:translate(calc(-50% + var(--px,120px)), calc(-50% + var(--py,120px))) scale(.3);}
  }
  .space-sub{
    position:absolute;
    bottom:24px;
    left:0; right:0;
    text-align:center;
    color:rgba(255,255,255,.55);
    font-size:11px;
    letter-spacing:.08em;
  }

  /* ---------- Universo animado (fondo del video) ---------- */
  .video-universe-bg{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .6s ease;
    background:radial-gradient(circle at 25% 20%, #1a0f30 0%, #050110 55%, #000 100%);
    overflow:hidden;
  }
  .video-universe-bg.show{opacity:1;}
  .galaxy{
    position:absolute;
    border-radius:50%;
    filter:blur(40px);
    opacity:.55;
    mix-blend-mode:screen;
  }
  .galaxy-1{
    width:46vmax; height:46vmax;
    top:-14vmax; left:-16vmax;
    background:radial-gradient(circle, rgba(255,47,176,.65), rgba(255,47,176,0) 70%);
    animation:galaxyDrift1 30s linear infinite;
  }
  .galaxy-2{
    width:52vmax; height:52vmax;
    bottom:-18vmax; right:-18vmax;
    background:radial-gradient(circle, rgba(120,140,255,.55), rgba(120,140,255,0) 70%);
    animation:galaxyDrift2 38s linear infinite;
  }
  .galaxy-3{
    width:36vmax; height:36vmax;
    top:38%; right:-12vmax;
    background:radial-gradient(circle, rgba(244,255,43,.4), rgba(244,255,43,0) 70%);
    animation:galaxyDrift3 44s linear infinite;
  }
  @keyframes galaxyDrift1{
    0%{transform:rotate(0deg) translateX(0) scale(1);}
    50%{transform:rotate(180deg) translateX(30px) scale(1.12);}
    100%{transform:rotate(360deg) translateX(0) scale(1);}
  }
  @keyframes galaxyDrift2{
    0%{transform:rotate(0deg) translateX(0) scale(1);}
    50%{transform:rotate(-180deg) translateX(-24px) scale(1.15);}
    100%{transform:rotate(-360deg) translateX(0) scale(1);}
  }
  @keyframes galaxyDrift3{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-26px) rotate(180deg);}
    100%{transform:translateY(0) rotate(360deg);}
  }
  .video-stars{
    position:absolute;
    inset:0;
    animation:videoStarSpin 200s linear infinite;
  }
  .video-star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes videoStarSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes twinkle{
    0%,100%{opacity:.25;}
    50%{opacity:.9;}
  }
  .video-content{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%;}

  /* ---------- Dedicatoria ---------- */
  .dedication{
    margin-top:22px;
    text-align:center;
    opacity:0;
    transform:translateY(8px);
    transition:opacity 1.1s ease, transform 1.1s ease;
  }
  .dedication.show{opacity:1; transform:translateY(0);}
  .ded-for{
    margin:0;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:18px;
    color:rgba(255,255,255,.82);
  }
  .ded-name{
    margin:6px 0 0;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:27px;
    line-height:1.2;
    color:var(--neon-pink-2);
    text-shadow:0 0 8px rgba(255,47,176,.8), 0 0 20px rgba(255,47,176,.55), 0 0 36px rgba(255,47,176,.35);
  }
  .nice-day{
    margin:14px 0 0;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:21px;
    color:var(--neon-yellow-2);
    text-shadow:0 0 8px rgba(244,255,43,.65), 0 0 20px rgba(244,255,43,.4);
    animation:heartbeat 2.4s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.04);}
  }

  /* ---------- Efecto de escritura ---------- */
  .pen{
    display:inline-block;
    font-size:.85em;
    transform:rotate(8deg);
    margin-left:2px;
    animation:penBob .5s ease-in-out infinite;
    opacity:1;
    transition:opacity .4s ease;
  }
  .pen.hide{opacity:0;}
  @keyframes penBob{
    0%,100%{transform:rotate(8deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-2px);}
  }
</style>
</head>
<body>

<!-- Definición de la rosa (reutilizable) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="rose-shape" viewBox="0 0 72 90">
      <!-- tallo y hojas -->
      <path d="M36 50 C35 62 38 74 36 88" fill="none" stroke="#f4ff2b" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M36 70 C27 64 20 67 17 73 C25 78 33 77 36 70Z" fill="rgba(244,255,43,.35)" stroke="#f4ff2b" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M37 60 C45 54 52 56 55 61 C48 66 41 65 37 60Z" fill="rgba(244,255,43,.35)" stroke="#f4ff2b" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- pétalos externos -->
      <path d="M36 6 C20 6 8 20 12 35 C15 46 27 52 36 52 C45 52 57 46 60 35 C64 20 52 6 36 6Z" fill="rgba(244,255,43,.22)" stroke="#f4ff2b" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- pétalos medios -->
      <path d="M36 14 C26 14 18 22 21 32 C23 40 31 44 36 44 C41 44 49 40 51 32 C54 22 46 14 36 14Z" fill="none" stroke="#f4ff2b" stroke-width="2" stroke-linejoin="round"/>
      <!-- espiral del centro -->
      <path d="M36 22 C29 22 27 30 32 34 C37 38 44 34 43 28 C42 23 35 23 34 28 C33 31 36 32 38 30" fill="none" stroke="#f4ff2b" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<button class="music-btn off" id="musicBtn" aria-label="Activar o silenciar la música" title="Música">🎵</button>
<audio id="song" src="photograph.mp3" loop preload="auto" playsinline></audio>

<div class="petals" id="petals"></div>

<div class="stage">

  <!-- PANTALLA 1: CLAVE -->
  <section class="screen active" id="screen-lock">
    <h1 class="lock-title">Ingresa el pin</h1>
    <p class="lock-sub">Una sorpresa para <b>Karen</b> · Solo tú lo sabrás</p>
    <div class="dots" id="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key fn" data-k="clear">Borrar</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-k="enter">Entrar</button>
    </div>
    <p class="hint" id="lockHint">&nbsp;</p>
  </section>

  <!-- PANTALLA 2: HISTORIA -->
  <section class="screen" id="screen-story">
    <div class="story-wrap">
      <div class="rose r1"><svg viewBox="0 0 72 90"><use href="#rose-shape"/></svg></div>
      <div class="rose r2"><svg viewBox="0 0 72 90"><use href="#rose-shape"/></svg></div>
      <div class="rose r3"><svg viewBox="0 0 72 90"><use href="#rose-shape"/></svg></div>
      <div class="rose r4"><svg viewBox="0 0 72 90"><use href="#rose-shape"/></svg></div>
      <div class="story-card">
        <p class="story-text" id="storyText"><span id="typedSpan"></span><span class="pen" id="penIcon">✍️</span></p>
        <div class="progress" id="progress"></div>
      </div>
    </div>
    <button class="next-btn" id="storyNextBtn">Siguiente</button>
  </section>

  <!-- PANTALLA 2.5: SUPERNOVA -->
  <section class="screen" id="screen-space">
    <div class="space-screen" id="spaceScreen">
      <div id="spaceStars"></div>
      <div class="nova-flash"></div>
      <span class="supernova-core"></span>
      <div id="novaRays"></div>
      <div id="novaParticles"></div>
      <p class="space-sub">preparando...</p>
    </div>
  </section>

  <!-- PANTALLA 3: VIDEO -->
  <section class="screen" id="screen-video">
    <div class="video-content">
      <div class="video-box">
        <iframe id="vimeoFrame" src="https://player.vimeo.com/video/1228565444?title=0&byline=0&portrait=0&loop=1" allow="autoplay; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
      <div class="dedication" id="dedication">
        <p class="ded-for">Para una persona maravillosa</p>
        <p class="ded-name">Karen Julieth Pardo Bolívar</p>
        <p class="nice-day">Te quiero mushooo. ¡Bonito Día! 😊👉👈</p>
      </div>
    </div>
  </section>

</div>

<div class="video-universe-bg" id="videoUniverseBg">
  <div class="galaxy galaxy-1"></div>
  <div class="galaxy galaxy-2"></div>
  <div class="galaxy galaxy-3"></div>
  <div class="video-stars" id="videoStars"></div>
</div>

<div class="warp-overlay" id="warpOverlay">
  <span class="warp-label" id="warpLabel">atravesando el universo…</span>
</div>

<script>
(function(){
  var CODE = "1603";
  var entered = "";
  var dots = document.querySelectorAll("#dots .dot");
  var dotsRow = document.getElementById("dots");
  var hint = document.getElementById("lockHint");
  var unlocking = false;

  /* ================= MÚSICA =================
     Photograph (piano) se carga desde photograph.mp3 (misma carpeta que index.html). Suena al acertar el PIN
     y se silencia al llegar al video. */
  var song = document.getElementById("song");
  var musicBtn = document.getElementById("musicBtn");
  var musicWanted = false;
  var usingSynth = false;
  var songOk = true;
  var VOL_MAIN = 0.55, VOL_LOW = 0.14;
  var currentVol = VOL_MAIN;
  var actx = null, master = null, padTimer = null;

  song.addEventListener("error", function(){ songOk = false; });
  song.volume = currentVol;

  function ensureSynth(){
    if(actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = currentVol * 0.35;
    master.connect(actx.destination);
  }
  function playChord(notes){
    var now = actx.currentTime;
    notes.forEach(function(f){
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.5, now + 1.2);
      g.gain.linearRampToValueAtTime(0, now + 4.2);
      o.connect(g); g.connect(master);
      o.start(now); o.stop(now + 4.4);
    });
  }
  function startSynth(){
    ensureSynth();
    if(!actx) return;
    if(actx.state === "suspended") actx.resume();
    usingSynth = true;
    var chords = [
      [261.63, 329.63, 392.00],
      [196.00, 246.94, 392.00],
      [220.00, 261.63, 329.63],
      [174.61, 261.63, 349.23]
    ];
    var n = 0;
    playChord(chords[0]);
    clearInterval(padTimer);
    padTimer = setInterval(function(){
      n = (n + 1) % chords.length;
      playChord(chords[n]);
    }, 4000);
  }
  function stopSynth(){
    clearInterval(padTimer);
    padTimer = null;
    if(actx && actx.state === "running") actx.suspend();
  }
  function applyVolume(){
    song.volume = currentVol;
    if(master) master.gain.value = currentVol * 0.35;
  }
  function setMusicLevel(level){
    currentVol = level;
    applyVolume();
  }
  function startMusic(){
    musicWanted = true;
    musicBtn.classList.remove("off");
    musicBtn.classList.add("on");
    song.muted = false;
    applyVolume();
    var p = song.play();
    if(p && p.catch){
      p.catch(function(err){
        if(err && err.name === "NotAllowedError"){
          /* el navegador pidió un toque: queda el botón para activarla */
          musicWanted = false;
          musicBtn.classList.remove("on");
          musicBtn.classList.add("off");
        } else {
          songOk = false;
          startSynth();
        }
      });
    }
  }
  function stopMusic(){
    musicWanted = false;
    musicBtn.classList.add("off");
    musicBtn.classList.remove("on");
    song.pause();
    stopSynth();
  }
  var fadeTimer = null;
  function fadeOutAndSilence(){
    musicWanted = false;
    musicBtn.classList.add("gone");
    clearInterval(fadeTimer);
    var steps = 14, n = 0, start = song.volume;
    fadeTimer = setInterval(function(){
      n++;
      var v = Math.max(0, start * (1 - n/steps));
      song.volume = v;
      if(master) master.gain.value = v * 0.35;
      if(n >= steps){
        clearInterval(fadeTimer);
        song.pause();
        song.currentTime = 0;
        song.muted = true;
        stopSynth();
        musicBtn.classList.remove("on");
        musicBtn.classList.add("off");
      }
    }, 60);
  }
  musicBtn.addEventListener("click", function(){
    if(musicWanted) stopMusic(); else startMusic();
  });

  /* ================= PÉTALOS ================= */
  var petalsBox = document.getElementById("petals");
  var petalTimer = null;
  function spawnPetal(){
    var p = document.createElement("span");
    p.className = "petal";
    var size = 9 + Math.random()*10;
    p.style.setProperty("--s", size.toFixed(1) + "px");
    p.style.setProperty("--d", (6 + Math.random()*5).toFixed(1) + "s");
    p.style.setProperty("--sway", (20 + Math.random()*50).toFixed(0) + "px");
    p.style.left = (Math.random()*100) + "%";
    petalsBox.appendChild(p);
    setTimeout(function(){ p.remove(); }, 12000);
  }
  function petalBurst(n){
    for(var i=0; i<n; i++){
      (function(k){ setTimeout(spawnPetal, k*90); })(i);
    }
  }
  function startPetals(){
    stopPetals();
    petalBurst(12);
    petalTimer = setInterval(spawnPetal, 900);
  }
  function stopPetals(){
    clearInterval(petalTimer);
    petalTimer = null;
  }

  /* ================= PIN ================= */
  function paintDots(){
    dots.forEach(function(d, i){
      d.classList.toggle("filled", i < entered.length);
    });
  }

  function handleKey(k){
    if(unlocking) return;

    if(k === "clear"){
      entered = "";
      hint.textContent = "\u00a0";
      hint.classList.remove("err");
      paintDots();
      return;
    }

    if(k === "enter"){
      if(entered.length < 4){
        hint.textContent = "Faltan números";
        hint.classList.add("err");
        return;
      }
      if(entered === CODE){
        unlocking = true;
        startMusic();
        dotsRow.classList.add("burst");
        hint.textContent = "\u00a0";
        setTimeout(function(){
          dotsRow.classList.remove("burst");
          unlocking = false;
          goTo("screen-story");
        }, 750);
      } else {
        hint.textContent = "Código incorrecto, inténtalo de nuevo";
        hint.classList.add("err");
        dotsRow.classList.remove("shake");
        void dotsRow.offsetWidth;
        dotsRow.classList.add("shake");
        entered = "";
        setTimeout(paintDots, 120);
      }
      return;
    }

    if(entered.length >= 4) return;
    entered += k;
    hint.textContent = "\u00a0";
    hint.classList.remove("err");
    paintDots();
  }

  document.getElementById("keypad").addEventListener("click", function(e){
    var btn = e.target.closest(".key");
    if(!btn) return;
    handleKey(btn.getAttribute("data-k"));
  });

  document.addEventListener("keydown", function(e){
    if(!document.getElementById("screen-lock").classList.contains("active")) return;
    if(/^[0-9]$/.test(e.key)) handleKey(e.key);
    else if(e.key === "Backspace") handleKey("clear");
    else if(e.key === "Enter") handleKey("enter");
  });

  /* ================= HISTORIA ================= */
  var phrases = [
    "Hola Preciosa 😊",
    "Espero estés pasando un bonito día",
    "Sabes... los mejores momentos solo se viven una vez.",
    "Y los recuerdos quedan grabados en la memoria para siempre.",
    "Hoy quiero grabar uno contigo😊",
    "Quiero que estas flores representen todos los buenos momentos vividos y los que todavía nos faltan por vivir.",
    "Porque una sonrisa siempre será la mejor medicina... le hace bien al corazón de quien te rodea.😊",
    "Recuerda que siempre contarás con la presencia y el amor de Dios, así como de personas que te queremos muchooo🫶",
    "Te mando un beshooo"
  ];
  var warpLines = [
    "cruzando estrellas…",
    "atravesando el universo…",
    "un instante más…",
    "casi llegamos…"
  ];
  var storyNextBtn = document.getElementById("storyNextBtn");
  var warpOverlay = document.getElementById("warpOverlay");
  var warpLabel = document.getElementById("warpLabel");
  var typedSpan = document.getElementById("typedSpan");
  var penIcon = document.getElementById("penIcon");
  var progress = document.getElementById("progress");
  var idx = 0;
  var busy = false;
  var typeTimer = null;

  function buildProgress(){
    progress.innerHTML = "";
    for(var i=0; i<phrases.length; i++){
      var d = document.createElement("span");
      d.className = "pd";
      progress.appendChild(d);
    }
  }
  function paintProgress(){
    var pds = progress.querySelectorAll(".pd");
    pds.forEach(function(d, i){ d.classList.toggle("on", i <= idx); });
  }

  function renderPhrase(){
    clearInterval(typeTimer);
    typedSpan.textContent = "";
    penIcon.classList.remove("hide");
    var chars = Array.from(phrases[idx]);
    var i = 0;
    typeTimer = setInterval(function(){
      typedSpan.textContent += chars[i];
      i++;
      if(i >= chars.length){
        clearInterval(typeTimer);
        setTimeout(function(){ penIcon.classList.add("hide"); }, 500);
      }
    }, 38);
    paintProgress();
    petalBurst(8);
  }

  function buildWarpStars(count){
    warpOverlay.querySelectorAll(".warp-star").forEach(function(s){ s.remove(); });
    for(var i=0; i<count; i++){
      var s = document.createElement("span");
      s.className = "warp-star";
      var angle = Math.random() * Math.PI * 2;
      var dist = 220 + Math.random() * 260;
      s.style.setProperty("--tx", (Math.cos(angle) * dist).toFixed(0) + "px");
      s.style.setProperty("--ty", (Math.sin(angle) * dist).toFixed(0) + "px");
      s.style.setProperty("--dur", (0.6 + Math.random()*0.6).toFixed(2) + "s");
      s.style.setProperty("--delay", (Math.random()*0.15).toFixed(2) + "s");
      warpOverlay.appendChild(s);
    }
  }

  function warpJump(onMidpoint, done, duration){
    duration = duration || 850;
    busy = true;
    warpLabel.textContent = warpLines[Math.floor(Math.random()*warpLines.length)];
    buildWarpStars(46);
    warpOverlay.classList.add("show");
    setTimeout(function(){
      onMidpoint && onMidpoint();
    }, duration * 0.42);
    setTimeout(function(){
      warpOverlay.classList.remove("show");
      busy = false;
      done && done();
    }, duration);
  }

  storyNextBtn.addEventListener("click", function(){
    if(busy) return;
    if(idx < phrases.length - 1){
      warpJump(function(){
        idx++;
        renderPhrase();
        if(idx === phrases.length - 1) storyNextBtn.textContent = "Ver sorpresa";
      });
    } else {
      goTo("screen-space");
    }
  });

  /* ================= ESPACIO / SUPERNOVA ================= */
  function buildSpaceStars(){
    var wrap = document.getElementById("spaceStars");
    wrap.innerHTML = "";
    for(var i=0; i<70; i++){
      var s = document.createElement("span");
      s.className = "space-bg-star";
      var size = Math.random() < .85 ? 1.5 : 2.5;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random()*100) + "%";
      s.style.top = (Math.random()*100) + "%";
      s.style.opacity = (0.25 + Math.random()*0.6).toFixed(2);
      wrap.appendChild(s);
    }
  }

  function buildSupernova(){
    var rays = document.getElementById("novaRays");
    var particles = document.getElementById("novaParticles");
    rays.innerHTML = "";
    particles.innerHTML = "";
    var rayCount = 18;
    for(var i=0; i<rayCount; i++){
      var r = document.createElement("span");
      r.className = "nova-ray";
      var angle = (360/rayCount) * i + (Math.random()*6 - 3);
      r.style.setProperty("--rlen", (120 + Math.random()*90).toFixed(0) + "px");
      r.style.setProperty("--rdelay", (0.45 + Math.random()*0.18).toFixed(2) + "s");
      r.style.transform = "rotate(" + angle.toFixed(1) + "deg)";
      rays.appendChild(r);
    }
    for(var j=0; j<46; j++){
      var p = document.createElement("span");
      p.className = "nova-particle";
      var pAngle = Math.random() * Math.PI * 2;
      var pDist = 90 + Math.random()*150;
      p.style.setProperty("--px", (Math.cos(pAngle) * pDist).toFixed(0) + "px");
      p.style.setProperty("--py", (Math.sin(pAngle) * pDist).toFixed(0) + "px");
      p.style.setProperty("--pdelay", (0.5 + Math.random()*0.3).toFixed(2) + "s");
      particles.appendChild(p);
    }
  }

  function buildVideoStars(){
    var wrap = document.getElementById("videoStars");
    if(wrap.childElementCount) return;
    for(var i=0; i<90; i++){
      var s = document.createElement("span");
      s.className = "video-star";
      var size = Math.random() < .8 ? 1.5 : 2.5;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random()*100) + "%";
      s.style.top = (Math.random()*100) + "%";
      s.style.animationDelay = (Math.random()*3).toFixed(2) + "s";
      wrap.appendChild(s);
    }
  }

  /* ================= NAVEGACIÓN ================= */
  function goTo(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    document.getElementById("videoUniverseBg").classList.toggle("show", id === "screen-video");

    if(id === "screen-story"){
      idx = 0;
      buildProgress();
      renderPhrase();
      startPetals();
    } else {
      stopPetals();
    }

    if(id === "screen-space"){
      var spaceScreen = document.getElementById("spaceScreen");
      spaceScreen.classList.remove("fly");
      buildSpaceStars();
      buildSupernova();
      void spaceScreen.offsetWidth;
      spaceScreen.classList.add("fly");
      setTimeout(function(){ goTo("screen-video"); }, 4000);
    }

    if(id === "screen-video"){
      fadeOutAndSilence();
      buildVideoStars();
      var ded = document.getElementById("dedication");
      ded.classList.remove("show");
      setTimeout(function(){ ded.classList.add("show"); }, 2800);
    }
  }
})();
</script>
</body>
